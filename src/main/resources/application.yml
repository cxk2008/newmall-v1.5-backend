spring:
  application:
    name: mall
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
#      username:
#      password:
      timeout: 3s
      connect-timeout: 3s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: 3s

redisson:
  single-server-config:
    address: redis://localhost:6379
    database: 0
#    username:
#    password:
    connection-minimum-idle-size: 8
    connection-pool-size: 32
    idle-connection-timeout: 10000
    connect-timeout: 3000
    timeout: 3000
    retry-attempts: 3
    retry-interval: 1500

rocketmq:
  name-server: 114.132.186.190:9876
  producer:
    group: mall-producer-group
#    access-key:
#    secret-key:
    send-message-timeout: 3000
    retry-times-when-send-failed: 2


server:
  port: 8080

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.itye.mall.entity
  configuration:
    map-underscore-to-camel-case: true

mall:
  jwt:
    secret: mall-dev-secret-change-me-at-least-32-characters
    expiration-seconds: 604800
  snowflake:
    worker-id: 1
    datacenter-id: 1
  elasticsearch:
    enabled: true
    host: 114.132.186.190
    port: 9200
    scheme: http
    username: elastic
    password: FTGFxrizSjeYR5LC
    connect-timeout-millis: 3000
    socket-timeout-millis: 30000
    index-init-enabled: true
    product-index: mall_products
